DATA.hl.forEach(h => { const m = document.createElement('div'); m.className = 'mark'; m.style.left = (h.t / D * 100) + '%'; track.appendChild(m); });

// highlights menu
const menu = $('menu'), hlbtn = $('hlbtn');
DATA.hl.forEach(h => {
  const b = document.createElement('button');
  const t = document.createElement('span'); t.className = 't'; t.textContent = fmt(h.t);
  const l = document.createElement('span'); l.textContent = h.label;
  b.append(t, l); b.addEventListener('click', () => { closeMenu(); seek(h.t, true); });
  menu.appendChild(b);
});
function closeMenu() { menu.hidden = true; hlbtn.setAttribute('aria-expanded', 'false'); }
hlbtn.addEventListener('click', e => { e.stopPropagation(); const open = menu.hidden; menu.hidden = !open; hlbtn.setAttribute('aria-expanded', String(open)); });
document.addEventListener('click', e => { if (!menu.hidden && !menu.contains(e.target)) closeMenu(); });

// playback
let auto = true, curW = -1, curC = -1, programmatic = 0;
function seek(t, play) { au.currentTime = Math.max(0, Math.min(D - 0.05, t - 0.08)); setAuto(true); render(true); if (play) au.play().catch(() => {}); }
const PLAY = 'M4.5 2.8v10.4L13 8z', PAUSE = 'M5 3.5h2v9H5zM9 3.5h2v9H9z';
function icon() { const p = au.paused; $('pico').firstElementChild.setAttribute('d', p ? PLAY : PAUSE); $('play').classList.toggle('on', !p); $('play').setAttribute('aria-label', p ? 'Play' : 'Pause'); }
$('play').addEventListener('click', () => au.paused ? au.play().catch(() => {}) : au.pause());
au.addEventListener('play', () => { icon(); loop(); }); au.addEventListener('pause', icon); au.addEventListener('ended', icon);
function muteIcon() { $('mute').setAttribute('aria-label', au.muted ? 'Unmute' : 'Mute'); $('mico').lastElementChild.style.display = au.muted ? 'none' : ''; }
$('mute').addEventListener('click', () => { au.muted = !au.muted; muteIcon(); });
$('speed').addEventListener('change', e => { au.playbackRate = +e.target.value; });
function setAuto(v) { auto = v; $('auto').setAttribute('aria-checked', String(v)); }
$('auto').addEventListener('click', () => { setAuto(!auto); if (auto) render(true); });
['wheel', 'touchmove'].forEach(ev => scroll.addEventListener(ev, () => { if (!au.paused) setAuto(false); }, { passive: true }));

// scrubber
const scrub = $('scrub'), tip = $('tip');
function tAt(x) { const r = scrub.getBoundingClientRect(); return Math.max(0, Math.min(1, (x - r.left) / r.width)) * D; }
function showTip(t, x) {
  const r = scrub.getBoundingClientRect();
  let lab = null; DATA.hl.forEach(h => { if (Math.abs(h.t - t) < D * 0.008) lab = h.label; });
  tip.textContent = ''; if (lab) { const b = document.createElement('b'); b.textContent = lab + '  '; tip.appendChild(b); }
  tip.appendChild(document.createTextNode(fmt(t)));
  tip.hidden = false;
  const w = tip.offsetWidth, left = Math.max(w / 2, Math.min(r.width - w / 2, x - r.left));
  tip.style.left = left + 'px';
  const cur = au.currentTime, a = Math.min(cur, t), b = Math.max(cur, t);
  $('prev').style.left = (a / D * 100) + '%'; $('prev').style.width = ((b - a) / D * 100) + '%';
}
let dragging = false;
scrub.addEventListener('pointermove', e => { showTip(tAt(e.clientX), e.clientX); if (dragging) { au.currentTime = tAt(e.clientX); render(true); } });
scrub.addEventListener('pointerleave', () => { if (!dragging) { tip.hidden = true; $('prev').style.width = 0; } });
scrub.addEventListener('pointerdown', e => { dragging = true; scrub.setPointerCapture(e.pointerId); au.currentTime = tAt(e.clientX); setAuto(true); render(true); });
scrub.addEventListener('pointerup', () => { dragging = false; });
scrub.addEventListener('keydown', e => { if (e.key === 'ArrowRight') { seek(au.currentTime + 5); e.preventDefault(); } if (e.key === 'ArrowLeft') { seek(au.currentTime - 5); e.preventDefault(); } });

// search
const q = $('q'); let hits = [], hi = -1;
q.addEventListener('input', () => {
  W.forEach(w => w.el.classList.remove('hit', 'cur'));
  const terms = q.value.toLowerCase().trim().split(/\s+/).map(s => s.replace(/[^a-z0-9']/g, '')).filter(Boolean);
  hits = [];
  if (terms.length) for (let i = 0; i + terms.length <= W.length; i++) {
    let ok = true; for (let k = 0; k < terms.length; k++) { const x = W[i + k].txt; if (k === terms.length - 1 ? !x.startsWith(terms[k]) : x !== terms[k]) { ok = false; break; } }
    if (ok) { hits.push(i); for (let k = 0; k < terms.length; k++) W[i + k].el.classList.add('hit'); }
  }
  hi = -1; $('count').textContent = terms.length ? (hits.length ? hits.length + ' found' : 'No results') : '';
});
q.addEventListener('keydown', e => {
  if (e.key === 'Enter' && hits.length) {
    hi = (hi + (e.shiftKey ? -1 : 1) + hits.length) % hits.length;
    W.forEach(w => w.el.classList.remove('cur')); const w = W[hits[hi]]; w.el.classList.add('cur');
    $('count').textContent = (hi + 1) + ' / ' + hits.length; setAuto(false);
    w.el.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }
  if (e.key === 'Escape') { q.value = ''; q.dispatchEvent(new Event('input')); q.blur(); }
});

// render loop
function scrollToEl(el) {
  const top = el.getBoundingClientRect().top - scroll.getBoundingClientRect().top + scroll.scrollTop;
  const want = Math.max(0, top - scroll.clientHeight * 0.3);
  if (Math.abs(want - scroll.scrollTop) > 32) scroll.scrollTo({ top: want, behavior: 'smooth' });
}
function render(force) {
  const t = au.currentTime;
  $('cur').textContent = fmt(t);
  $('fill').style.width = (t / D * 100) + '%';
  scrub.setAttribute('aria-valuenow', Math.round(t)); scrub.setAttribute('aria-valuemax', Math.round(D));
  let ci = 0; for (let i = 0; i < DATA.clips.length; i++) if (t >= DATA.clips[i].t0 - 1.0) ci = i;
  let lo = 0, hiI = W.length - 1, wi = -1;
  while (lo <= hiI) { const m = (lo + hiI) >> 1; if (W[m].t <= t + 0.03) { wi = m; lo = m + 1; } else hiI = m - 1; }
  if (wi >= 0 && (W[wi].ci !== ci || W[wi].rm)) wi = -1;
  if (wi !== curW || ci !== curC || force) {
    if (curW >= 0) W[curW].el.classList.remove('now');
    if (wi >= 0) W[wi].el.classList.add('now');
    titles.forEach((h, i) => h.classList.toggle('now', i === ci && (t > 0 || !au.paused)));
    if (ci !== curC || force) $('where').textContent = DATA.clips[ci].label;
    if (auto && (t > 0 || force)) scrollToEl(wi >= 0 ? W[wi].el : titles[ci]);
    curW = wi; curC = ci;
  }
}
function loop() { render(); if (!au.paused) requestAnimationFrame(loop); }
au.addEventListener('timeupdate', () => render());
au.addEventListener('seeked', () => render());
document.addEventListener('keydown', e => {
  if (e.target === q || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space' && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); $('play').click(); }
  if (e.key === 'm') $('mute').click();
});
icon(); muteIcon(); render(true); scroll.scrollTop = 0;
</script>
</body></html>
