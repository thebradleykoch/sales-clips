:root[data-theme="dark"]{
  --card:#251e21; --text:#fcf8f9; --muted:#b8a5ad;
  --fill:rgba(157,139,147,.09); --fill-hover:rgba(157,139,147,.18); --border:rgba(7,5,6,.30);
  --track:rgba(184,165,173,.12); --played:rgba(169,186,245,.6); --preview:rgba(169,186,245,.16); --playhead:rgba(169,186,245,.55);

.menu-wrap{position:relative;flex:none}

.menu{position:absolute;left:0;top:40px;z-index:20;width:min(400px,calc(100vw - 32px));max-height:min(360px,calc(100vh - 140px));overflow-y:auto;background:var(--menu);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(38,23,29,.16),0 2px 4px rgba(38,23,29,.12);padding:4px;display:flex;flex-direction:column}

.search{flex:1;min-width:0;height:32px;display:flex;align-items:center;border-radius:8px;background:var(--fill);border:1px solid transparent;color:var(--muted);padding:0 4px 0 8px}

.mk .ic{width:20px;height:20px}
.mk:hover{background:var(--accent-tint)}

.mk.now{background:var(--accent-tint)}

.who{font-weight:560;font-size:16px;line-height:24px;letter-spacing:-.176px}

p.say{margin:0;padding:0 0 24px;font-weight:420;font-size:16px;line-height:32px;letter-spacing:-.176px}
.w{position:relative;isolation:isolate;padding:6px 0;cursor:pointer}
.w::before{content:"";position:absolute;inset:0 -4px;border-radius:4px;z-index:-1;background:transparent;transition:background .08s}
.w:hover::before{background:var(--fill-hover)}
.w.hit::before{background:var(--hit)}

.w.now{color:var(--on)}
.w.now.s1::before{background:var(--sp1)}
.w.now.s2::before{background:var(--sp2)}
.w.rm{color:var(--muted);cursor:default}
.w.rm::before{display:none}

.track{position:absolute;left:4px;right:4px;top:12px;height:6px;border-radius:2px;background:var(--track);overflow:hidden;transition:transform .1s}
.scrub:hover .track{transform:scaleY(1.34)}
.prev,.fill{position:absolute;left:0;top:0;bottom:0;width:0}
.prev{background:var(--preview)}
.fill{background:var(--played)}
.gap{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--card)}
.tick{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--accent);opacity:.55}
.head{position:absolute;top:9px;width:4px;height:12px;margin-left:-2px;border-radius:2px;background:var(--playhead);pointer-events:none;display:none}
.scrub:hover .head{display:block}
.tip{position:absolute;bottom:26px;transform:translateX(-50%);background:var(--tip);color:var(--tip-text);border-radius:4px;padding:4px 8px;font-weight:460;font-size:11px;line-height:16px;white-space:nowrap;pointer-events:none;font-variant-numeric:tabular-nums;max-width:300px;overflow:hidden;text-overflow:ellipsis}
.tip b{font-weight:600}
.ctl{display:flex;align-items:center;gap:4px;height:32px}
.ib{width:32px;height:32px;padding:8px;border-radius:8px;display:grid;place-items:center;transition:background .1s;flex:none}
.ib:hover{background:var(--fill-hover)}
.play{background:var(--accent-tint);color:var(--accent)}
.play:hover{background:var(--accent-tint);filter:brightness(.97)}
.vol{display:flex;align-items:center}
.vol input{width:0;opacity:0;transition:width .15s,opacity .15s,margin .15s;accent-color:var(--accent);margin:0;height:16px}
.vol:hover input,.vol:focus-within input{width:64px;opacity:1;margin:0 8px 0 4px}
.time{padding:0 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.sp{flex:1}
.speed{position:relative;height:32px;display:flex;align-items:center;gap:4px;border-radius:8px;padding:0 4px 0 8px}
.speed:hover{background:var(--fill-hover)}
.speed select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:var(--text);cursor:pointer;padding:0 4px;outline:0;font-family:var(--font)}
.speed select option{color:#26171d;background:#fff}
.auto{display:flex;align-items:center;height:32px;border-radius:8px;padding:0 0 0 4px}
.auto .sw{width:20px;height:12px;margin:4px;border-radius:9999px;background:var(--fill-hover);box-shadow:inset 0 0 0 1px var(--border);position:relative;transition:background .12s}
.auto .sw::after{content:"";position:absolute;top:2px;left:2px;width:8px;height:8px;border-radius:50%;background:var(--card);box-shadow:0 0 0 1px var(--border);transition:transform .12s}

.auto .lab{padding:0 8px}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:560px){
  .col{padding:0 16px 120px}
  h1{font-size:20px;line-height:28px}
  .hlbtn .lbl,.hlbtn .chev{display:none}
  .vol:hover input{width:0;opacity:0;margin:0}
  .auto .lab{display:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

const $ = id => document.getElementById(id);

  }
  const cls = spCls(b.sp);
  const box = document.createElement('div');
  const who = document.createElement('div'); who.className = 'who ' + cls; who.textContent = b.sp;
  const p = document.createElement('p'); p.className = 'say';
  b.words.forEach((w, i) => {
    const s = document.createElement('span'); s.className = 'w ' + cls + (w[2] ? ' rm' : ''); s.textContent = w[0];
    const idx = W.length;
    if (!w[2]) s.addEventListener('click', () => seek(W[idx].t, true));
    W.push({ t: w[1], el: s, rm: !!w[2], txt: w[0].toLowerCase().replace(/[^a-z0-9']/g, '') });
    p.appendChild(s); if (i < b.words.length - 1) p.appendChild(document.createTextNode(' '));
  });
  box.append(who, p); col.appendChild(box);
});
W.forEach((w, i) => { w.ci = 0; });
DATA.clips.forEach((c, ci) => W.forEach(w => { if (w.t >= c.t0 - 0.01) w.ci = ci; }));

// track: clip gaps + marker ticks
const track = $('track');
DATA.clips.forEach((c, i) => { if (i) { const g = document.createElement('div'); g.className = 'gap'; g.style.left = ((c.t0 - 0.5) / D * 100) + '%'; track.appendChild(g); } });
MK.forEach(m => { if (m.t > 0.5) { const k = document.createElement('div'); k.className = 'tick'; k.style.left = (m.t / D * 100) + '%'; track.appendChild(k); } });

// highlights menu
const menu = $('menu'), hlbtn = $('hlbtn'), menuBtns = [];
MK.forEach(m => {
  const b = document.createElement('button');
  const t = document.createElement('span'); t.className = 't'; t.textContent = fmt(m.t);
  const l = document.createElement('span'); l.textContent = m.label;

  const cur = au.currentTime, a = Math.min(cur, t), b = Math.max(cur, t);
  $('prev').style.left = (a / D * 100) + '%'; $('prev').style.width = ((b - a) / D * 100) + '%';

let dragging = false;
scrub.addEventListener('pointermove', e => { hover(e.clientX); if (dragging) { au.currentTime = tAt(e.clientX); render(true); } });

scrub.addEventListener('pointerdown', e => { dragging = true; scrub.setPointerCapture(e.pointerId); au.currentTime = tAt(e.clientX); setAuto(true); render(true); });
scrub.addEventListener('pointerup', () => { dragging = false; });
scrub.addEventListener('keydown', e => { if (e.key === 'ArrowRight') { seek(au.currentTime + 5); e.preventDefault(); } if (e.key === 'ArrowLeft') { seek(au.currentTime - 5); e.preventDefault(); } });

// search with previous / next
const q = $('q'); let hits = [], hi = -1, hitLen = 1;
function showHit() {

  if (hi < 0) return;
  for (let k = 0; k < hitLen; k++) W[hits[hi] + k].el.classList.add('cur');
  $('count').textContent = (hi + 1) + ' / ' + hits.length;
  setAuto(false); W[hits[hi]].el.scrollIntoView({ block: 'center', behavior: 'smooth' });
}

  W.forEach(w => w.el.classList.remove('hit', 'cur'));
  const terms = q.value.toLowerCase().trim().split(/\s+/).map(s => s.replace(/[^a-z0-9']/g, '')).filter(Boolean);
  hits = []; hitLen = terms.length || 1;
  if (terms.length) for (let i = 0; i + terms.length <= W.length; i++) {
    let ok = true; for (let k = 0; k < terms.length; k++) { const x = W[i + k].txt; if (k === terms.length - 1 ? !x.startsWith(terms[k]) : x !== terms[k]) { ok = false; break; } }
    if (ok) { hits.push(i); for (let k = 0; k < terms.length; k++) W[i + k].el.classList.add('hit'); }

$('prevHit').addEventListener('click', e => { e.preventDefault(); step(-1); });
q.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); step(e.shiftKey ? -1 : 1); }
  if (e.key === 'Escape') { q.value = ''; q.dispatchEvent(new Event('input')); q.blur(); }
});

// render
function scrollToEl(el) {
  const top = el.getBoundingClientRect().top - scroll.getBoundingClientRect().top + scroll.scrollTop;
  const want = Math.max(0, top - scroll.clientHeight * 0.3);
  if (Math.abs(want - scroll.scrollTop) > 32) scroll.scrollTo({ top: want, behavior: 'smooth' });
}
function render(force) {
  const t = au.currentTime;
  $('cur').textContent = fmt(t);
  $('fill').style.width = (t / D * 100) + '%';
  scrub.setAttribute('aria-valuenow', Math.round(t)); scrub.setAttribute('aria-valuemax', Math.round(D));
  let ci = 0; DATA.clips.forEach((c, i) => { if (t >= c.t0 - 1.0) ci = i; });
  let lo = 0, hiI = W.length - 1, wi = -1;
  while (lo <= hiI) { const m = (lo + hiI) >> 1; if (W[m].t <= t + 0.03) { wi = m; lo = m + 1; } else hiI = m - 1; }
  if (wi >= 0 && (W[wi].ci !== ci || W[wi].rm)) wi = -1;
  let mi = -1; MK.forEach((m, i) => { if (m.t <= t + 0.05) mi = i; });
  if (wi !== curW || mi !== curM || force) {
    if (curW >= 0) W[curW].el.classList.remove('now');
    if (wi >= 0) W[wi].el.classList.add('now');
    MK.forEach((m, i) => m.el.classList.toggle('now', i === mi && wi < 0 && (t > 0 || !au.paused)));
    menuBtns.forEach((b, i) => b.classList.toggle('cur', i === mi));
    if (auto && (t > 0 || force)) { const el = wi >= 0 ? W[wi].el : (mi >= 0 ? MK[mi].el : null); if (el) scrollToEl(el); }
    curW = wi; curM = mi;
  }
}
function loop() { render(); if (!au.paused) requestAnimationFrame(loop); }
au.addEventListener('timeupdate', () => render());
au.addEventListener('seeked', () => render());
document.addEventListener('keydown', e => {
  if (e.target === q || e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT') return;
  if (e.code === 'Space' && !(e.target instanceof HTMLButtonElement)) { e.preventDefault(); $('play').click(); }
  if (e.key === 'm') $('mute').click();
});
playIcon(); volIcon(); render(true); scroll.scrollTop = 0;
</script>
